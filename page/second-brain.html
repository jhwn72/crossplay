<title>Second Brain</title>
<style>
/* Layout: a single iMessage thread, full height. Header and text bar stick; the thread scrolls between them. Deliberately dark only. */
:root{
  --bg:#000; --in:#26252a; --out:#0b84fe; --gray:#8e8e93; --blue:#0a84ff; --red:#ff453a;
  --bar:rgba(28,28,30,.8); --side:#1c1c1e; --raised:#3a3a3c; --fg:#fff; --dim:#636366;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
html{scroll-padding-bottom:96px;scroll-padding-top:72px}
body{background:var(--bg);color:var(--fg);margin:0}
.im-app{background:var(--bg);color:var(--fg);max-width:720px;margin:0 auto;min-width:0;min-height:100%;display:flex;flex-direction:column;
  font:17px/22px var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
.im-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;
  padding:8px 10px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid rgba(255,255,255,.12)}
.im-back{display:flex;align-items:center;gap:2px;color:var(--blue)}
.im-back svg{width:13px;height:21px}
.im-title{display:flex;flex-direction:column;align-items:center;gap:3px}
.im-stack{display:flex}
.im-stack .im-av{width:40px;height:40px;border:2px solid #1c1c1e}
.im-stack .im-av+.im-av{margin-left:-12px}
.im-gname{font-size:11px;line-height:13px;display:flex;align-items:center;gap:3px}
.im-gname svg{width:6px;height:10px;opacity:.55}
.im-live{width:6px;height:6px;border-radius:50%;background:#30d158;display:inline-block}
.im-video{justify-self:end;color:var(--blue);padding-right:6px}
.im-video svg{width:28px;height:20px;display:block}
.im-body{flex:1;padding:6px 16px 28px}
.im-time,.im-sys{text-align:center;color:var(--gray);font-size:11px;line-height:14px;margin:18px 0 10px}
.im-time b{font-weight:600}
.im-sys button{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;padding:2px 4px}
.im-sys.bad{color:var(--red)}
.im-sys.queued{color:var(--fg);background:var(--in);border-radius:12px;padding:8px 12px;margin:12px auto;max-width:420px;text-align:left;font-size:12px;line-height:16px}
.im-sys.queued b{color:#ffd60a;font-weight:600}
.im-run{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:8px;margin-top:10px}
.im-run.me{grid-template-columns:minmax(0,1fr)}
.im-name{grid-column:2;color:var(--gray);font-size:11px;line-height:13px;margin:0 0 2px 12px}
.im-msgs{grid-column:2;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.im-run.me .im-msgs{grid-column:1;align-items:flex-end}
.im-avcell{grid-column:1;grid-row:2;align-self:end;position:relative;z-index:2}
.im-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:none}
.im-av svg{width:58%;height:58%}
.im-av.claude{background:#d97757}
.im-av.codex{background:#f2f2f2}
.im-b,.im-file{position:relative;background:var(--in);border-radius:18px}
.im-b{padding:7px 12px 8px;max-width:min(78%,430px);white-space:pre-wrap;overflow-wrap:anywhere}
.im-b.me{background:var(--out)}
.im-b.fail{opacity:.55}
.tail::before,.tail::after{content:"";position:absolute;bottom:0;height:22px}
.tail::before{left:-7px;width:20px;background:var(--in);border-bottom-right-radius:16px 14px}
.tail::after{left:-26px;width:26px;background:var(--bg);border-bottom-right-radius:10px}
.im-b.me.tail::before{left:auto;right:-7px;background:var(--out);border-bottom-right-radius:0;border-bottom-left-radius:16px 14px}
.im-b.me.tail::after{left:auto;right:-26px;border-bottom-right-radius:0;border-bottom-left-radius:10px}
.im-b.has-tb{margin-top:14px}
.im-tb{position:absolute;top:-17px;right:-14px;width:30px;height:30px;border-radius:50%;background:var(--raised);
  border:2px solid var(--bg);display:grid;place-items:center;z-index:1}
.im-tb svg{width:15px;height:15px;fill:var(--fg)}
.im-tb::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--raised);border:2px solid var(--bg);bottom:-6px;left:-2px}
.im-file{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;max-width:min(78%,360px);color:inherit;text-decoration:none}
.im-file:focus-visible,.im-send:focus-visible,.im-sys button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.im-ficon{width:34px;height:42px;flex:none;border-radius:6px;background:var(--raised);display:grid;place-items:center}
.im-ficon svg{width:18px;height:18px}
.im-fcol{min-width:0}
.im-ft{font-size:15px;line-height:19px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-fs{font-size:13px;line-height:16px;color:var(--gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-status{color:var(--gray);font-size:11px;line-height:13px;margin-top:3px}
.im-status.bad{color:var(--red)}
.im-dots{display:flex;gap:4px;padding:12px 14px}
.im-dots i{width:8px;height:8px;border-radius:50%;background:var(--gray);opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .im-dots i{animation:im-blink 1.2s infinite ease-in-out}
  .im-dots i:nth-child(2){animation-delay:.2s}.im-dots i:nth-child(3){animation-delay:.4s}
}
@keyframes im-blink{0%,60%,100%{opacity:.35}30%{opacity:1}}
.im-doing{color:var(--gray);font-size:11px;line-height:13px;margin:3px 0 0 12px}
.im-foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:flex-end;gap:8px;
  padding:8px 10px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.85);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.im-plus{width:34px;height:34px;border-radius:50%;background:#2c2c2e;display:grid;place-items:center;flex:none}
.im-plus svg{width:16px;height:16px}
.im-input{flex:1;min-width:0;display:flex;align-items:flex-end;border:1px solid var(--raised);border-radius:18px;padding:5px 4px 5px 14px;min-height:34px;box-sizing:border-box}
.im-input textarea{flex:1;min-width:0;background:none;border:0;outline:0;resize:none;color:var(--fg);font:inherit;padding:0;margin:0;max-height:120px;height:22px;line-height:22px}
.im-input textarea::placeholder{color:var(--dim)}
.im-mic{width:16px;height:20px;margin:1px 6px 0}
.im-send{width:28px;height:28px;border-radius:50%;background:var(--out);border:0;display:none;place-items:center;flex:none;cursor:pointer;padding:0;margin-left:6px}
.im-send svg{width:14px;height:14px}
.im-input.typing .im-send{display:grid}
.im-input.typing .im-mic{display:none}
.im-empty{color:var(--gray);text-align:center;padding:60px 0;font-size:15px}
.im-shell{min-height:100%;background:var(--bg)}
/* conversation list: the Mac sidebar on wide screens, the iPhone list screen on narrow ones */
.im-side{display:none;flex-direction:column;background:var(--side);font:13px/16px var(--font);color:var(--fg)}
.im-side-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 14px 8px;color:var(--gray)}
.im-side-title{font-size:28px;line-height:34px;font-weight:700;color:var(--fg);letter-spacing:.2px}
.im-side-top svg{width:18px;height:18px;display:block}
.im-search{margin:0 12px 10px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:8px;padding:5px 8px;color:var(--gray)}
.im-search svg{width:13px;height:13px;flex:none}
.im-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;padding:2px 0}
.im-search input::placeholder{color:var(--gray)}
.im-search button{background:none;border:0;color:var(--gray);cursor:pointer;font:inherit;padding:0 2px}
.im-convos{overflow:auto;padding:0 8px 12px;flex:1;min-height:0}
.im-convo{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;
  background:none;border:0;color:inherit;font:inherit;text-align:left;width:100%}
.im-convo:hover{background:rgba(255,255,255,.06)}
.im-convo.on{background:var(--blue);color:#fff}
.im-convo:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.im-cav{position:relative;width:44px;height:44px}
.im-cav .im-av{position:absolute;width:30px;height:30px;border:2px solid var(--side)}
.im-convo.on .im-cav .im-av{border-color:var(--blue)}
.im-cav .im-av:first-child{left:0;top:0}
.im-cav .im-av:last-child{right:0;bottom:0}
.im-cav .im-av.im-init{position:static;width:44px;height:44px;border:0}
.im-init{background:linear-gradient(#a5abb8,#858994);color:#fff;font-weight:600;font-size:15px;letter-spacing:.3px}
.im-cline{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.im-cname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im-ctime{font-size:12px;opacity:.75;flex:none}
.im-cprev{opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.im-cprev mark{background:rgba(255,214,10,.35);color:inherit;border-radius:3px;padding:0 1px}
.im-shead{color:var(--gray);font-size:12px;font-weight:600;padding:8px 10px 4px}
.im-back{background:none;border:0;padding:0;cursor:pointer;font:inherit}
.im-b.flash{animation:im-flash 1.6s ease-out}
@keyframes im-flash{0%,40%{box-shadow:0 0 0 3px #ffd60a}100%{box-shadow:0 0 0 3px rgba(255,214,10,0)}}
@media (max-width:899px){
  .im-shell.list .im-side{display:flex;min-height:100vh;min-height:100dvh}
  .im-shell.list .im-app{display:none}
  .im-side .im-convo.on{background:none;color:inherit}
}
@media (min-width:900px){
  .im-shell{display:grid;grid-template-columns:clamp(260px,26vw,340px) minmax(0,1fr)}
  .im-side{display:flex;position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid rgba(255,255,255,.08)}
  .im-side-title{display:none}
  .im-app{max-width:none;margin:0}
  .im-back{visibility:hidden}
  .im-body{padding:8px clamp(20px,4vw,56px) 28px}
  .im-b{max-width:min(62%,560px);font-size:15px;line-height:20px}
  .im-file{max-width:min(50%,380px)}
  .im-foot{padding-left:clamp(20px,4vw,56px);padding-right:clamp(20px,4vw,56px)}
}
</style>

<div class="im-shell">
<aside class="im-side" aria-label="Conversations">
  <div class="im-side-top"><span class="im-side-title">Messages</span><svg aria-hidden="true" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12.5 2.5l3 3-8 8H4.5v-3z"/><path d="M9 3H3.5A1.5 1.5 0 0 0 2 4.5v10A1.5 1.5 0 0 0 3.5 16h10a1.5 1.5 0 0 0 1.5-1.5V9"/></svg></div>
  <label class="im-search"><svg aria-hidden="true" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="5.5" cy="5.5" r="4.2"/><path d="m8.7 8.7 3.3 3.3"/></svg><input id="im-q" type="search" placeholder="Search" aria-label="Search messages" autocomplete="off"><button id="im-qx" type="button" aria-label="Clear search" hidden>✕</button></label>
  <div class="im-convos" id="im-convos"></div>
</aside>
<div class="im-app">
  <header class="im-head">
    <button class="im-back" id="im-back" type="button" aria-label="All conversations"><svg viewBox="0 0 13 21" fill="none"><path d="M11 2 2.5 10.5 11 19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="im-title">
      <div class="im-stack" id="im-stack"></div>
      <div class="im-gname"><span class="im-live" id="im-live" hidden title="Connected to the vault"></span><span id="im-hname">Second Brain</span> <svg viewBox="0 0 6 10" fill="none"><path d="m1 1 4 4-4 4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="im-video" aria-hidden="true"><svg viewBox="0 0 28 20" fill="currentColor"><rect x="0" y="2" width="19" height="16" rx="4"/><path d="M20.5 8.2 26 4.6c.8-.5 1.8.1 1.8 1v8.8c0 .9-1 1.5-1.8 1l-5.5-3.6z"/></svg></div>
  </header>

  <main class="im-body" id="im-chat" aria-live="polite"><div class="im-empty">Loading the chat…</div></main>

  <footer class="im-foot">
    <div class="im-plus" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="#98989d" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div class="im-input" id="im-input">
      <textarea id="im-text" rows="1" placeholder="iMessage" aria-label="Message"></textarea>
      <svg class="im-mic" viewBox="0 0 16 20" fill="none" stroke="#636366" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="1" width="7" height="12" rx="3.5"/><path d="M1.5 9.5a6.5 6.5 0 0 0 13 0M8 16v3"/></svg>
      <button class="im-send" id="im-send" aria-label="Send"><svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5"/></svg></button>
    </div>
  </footer>
</div>
</div>

<script>
(function(){
  "use strict";
  var TZ=(Intl.DateTimeFormat().resolvedOptions().timeZone)||"UTC", VAULT_NAME="Obsidian", SERVER="host:second-brain-vault", CHAT="chat/Second Brain.md";
  var NAMES={claude:"Claude",codex:"Codex",user:"You"};
  var LINE=/^- (\d{4}-\d{2}-\d{2}T[\d:.]+Z) \| (claude|codex|user) \| (.*?) \| (.*?) \| (.+)$/;
  var BLOCK=/\s\^([A-Za-z0-9-]+)\s*$/;
  var GLYPH={
    claude:'<svg viewBox="0 0 24 24"><g stroke="#fff" stroke-width="2.6" stroke-linecap="round">'+[0,1,2,3,4,5,6,7].map(function(i){return '<line x1="12" y1="12" x2="12" y2="'+(12-(i%2?7:9.5))+'" transform="rotate('+(i*45)+' 12 12)"/>';}).join("")+'</g></svg>',
    codex:'<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.9">'+[0,60,120,180,240,300].map(function(a){return '<rect x="9.2" y="2.6" width="5.6" height="11" rx="2.8" transform="rotate('+a+' 12 12)"/>';}).join("")+'</svg>'
  };
  var THUMB='<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>';
  var HEART='<svg viewBox="0 0 24 24"><path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09A6 6 0 0 1 16.5 3C19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>';
  var DOC='<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"><path d="M12 2 4 7v10l8 5 8-5V7z"/><path d="M12 2v20M4 7l8 5 8-5" opacity=".55"/></svg>';

  // ---- state ----
  var chatText="", mode="connecting", vaultRoot=null;
  var db=null, user=null, uid=null, mcp=null, sample=null, canEdit=false, toolsOk=false;
  var outbox=[], failed={}, busy=false, doing="", sysError="", lastSaved="", scrolled=false;
  var diag={at:"",steps:[]}, offlineWhy="";
  var cur="all", projects=[], query="";
  try{var saved=localStorage.getItem("sb-chat");if(saved)cur=saved;}catch(e){}
  function projName(p){return String(p).split("/").pop().replace(/\.md$/,"");}
  function parseProjects(text){
    var out=[],seen={},re=/\[\[(projects\/[^\]|#]+?)(?:\.md)?(?:[|#][^\]]*)?\]\]/g,m;
    while((m=re.exec(String(text||"")))){var p=m[1]+".md";if(p!=="projects/index.md"&&!seen[p]){seen[p]=1;out.push(p);}}
    return out;
  }
  function note(k,v){diag.steps.push(k+": "+(typeof v==="string"?v:JSON.stringify(v)).slice(0,600));}
  function errInfo(e){return e?(e.code||e.name||"error")+" "+String(e.message||"").slice(0,300):"unknown";}
  function saveDiag(){if(!db||!uid)return;diag.at=iso();diag.mode=mode;db.doc("data/users/"+uid+"/diag").set(diag).catch(function(){});}

  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function avatar(w){var a=el("div","im-av "+w);a.innerHTML=GLYPH[w]||"";a.setAttribute("aria-label",NAMES[w]);return a;}
  function dayKey(d){return d.toLocaleDateString("en-CA",{timeZone:TZ});}
  function clock(d){return d.toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"});}
  function stamp(d){var n=new Date(),k=dayKey(d);var lead=k===dayKey(n)?"Today":k===dayKey(new Date(n-864e5))?"Yesterday":d.toLocaleDateString("en-US",{timeZone:TZ,weekday:"short",month:"short",day:"numeric"});return[lead,clock(d)];}
  function iso(d){return (d||new Date()).toISOString().replace(/\.\d+Z$/,"Z");}
  function oneLine(s){return String(s||"").replace(/\s*\n+\s*/g," ").trim();}

  function parse(text){
    var rows=[];
    String(text||"").split("\n").forEach(function(raw,i){
      var m=LINE.exec(raw.replace(/\r$/,""));if(!m)return;
      var t=m[5],b=BLOCK.exec(t),id="l"+i;
      if(b){id=b[1];t=t.slice(0,b.index);}
      var note=m[3].trim(),react=m[4].trim();
      if(note==="-")note="";if(react==="-")react="";
      var rp=react?react.split(" "):["",""];
      rows.push({id:id,ts:m[1],sender:m[2],file:note,tapback:rp[0]||"",tapback_by:rp[1]||"",text:t.trim()});
    });
    return rows;
  }
  function chatIds(){var s={};parse(chatText).forEach(function(r){s[r.id]=true;});return s;}
  function pending(){var s=chatIds();return outbox.filter(function(m){return !s[m.id];});}

  // ---- vault access (Claude desktop app with the second-brain-vault connector) ----
  function textOf(r){
    var p=r&&r.payload;
    if(typeof p==="string")return p;
    if(p&&typeof p.content==="string")return p.content;
    return ((r&&r.content)||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
  }
  function call(tool,input,signal){return mcp.callTool(SERVER,tool,input,signal?{signal:signal}:undefined);}
  function full(rel){return vaultRoot+"/"+rel;}
  async function readChat(){return textOf(await call("read_text_file",{path:full(CHAT)}));}
  async function findVault(){
    var listed;try{listed=textOf(await call("list_allowed_directories",{}));}catch(e){note("list_allowed_directories failed",errInfo(e));offlineWhy=e&&e.code==="server_not_connected"?"The vault connector isn't reachable from this page.":e&&(e.code==="not_granted"||e.code==="denied")?"Access to the vault connector was declined.":"The vault connector didn't answer.";throw e;}
    note("allowed dirs",listed);
    var dirs=listed.split("\n").map(function(s){return s.trim();}).filter(function(s){return /^(\/|[A-Za-z]:[\\\/])/.test(s);});
    var tries=[];dirs.forEach(function(d){d=d.replace(/[\\\/]+$/,"");tries.push(d);});
    for(var i=0;i<tries.length;i++){
      try{var t=textOf(await call("read_text_file",{path:tries[i]+"/"+CHAT}));if(/## Messages/.test(t)){vaultRoot=tries[i];VAULT_NAME=vaultRoot.split(/[\\\/]/).pop()||VAULT_NAME;note("vault",vaultRoot);return t;}note("no chat at",tries[i]);}catch(e){note("read failed "+tries[i],errInfo(e));}
    }
    if(!offlineWhy)offlineWhy="The vault connector can't find chat/Second Brain.md in its folder.";
    return null;
  }
  async function appendLines(lines){
    var t=await readChat();
    if(t&&!/\n$/.test(t))t+="\n";
    t+=lines.join("\n")+"\n";
    await call("write_file",{path:full(CHAT),content:t});
    chatText=t;saveSnapshot();
  }
  function saveSnapshot(){
    if(!db||!canEdit||mode!=="live"||chatText===lastSaved)return;
    var text=chatText.length>200000?chatText.slice(-200000):chatText;
    lastSaved=chatText;
    db.doc("chat/snapshot").set({text:text,projects:projects,vaultName:VAULT_NAME,updated:iso()}).catch(function(){lastSaved="";});
  }
  async function poll(){
    if(mode!=="live"||busy||document.visibilityState!=="visible")return;
    try{var t=await readChat();if(t!==chatText){chatText=t;saveSnapshot();render();}}catch(e){}
  }

  // ---- Claude replies ----
  function safeRel(p){

     execute:async function(i,c){var p=noChat(safeRel(i.path));say("Editing "+noteName(p)+"…");if(c.signal.aborted)return "stopped";await call("edit_file",{path:full(p),edits:[{oldText:String(i.old_text),newText:String(i.new_text)}]},c.signal);return "edited "+p;}},

      var t0=Date.now();

      root.appendChild(el("div","im-sys",(offlineWhy?offlineWhy+" ":"")+"Claude will reply at the next hourly sync."));
    }
    if(!busy&&!waiting.length&&!sysError&&mode!=="live"&&mode!=="connecting"&&offlineWhy){root.appendChild(el("div","im-sys",offlineWhy+" Texts get answered by the hourly sync."));}
    if(!scrolled&&rows.length){scrolled=true;requestAnimationFrame(function(){var l=root.lastElementChild;if(l&&l.scrollIntoView)l.scrollIntoView({block:"end"});});}
  }

  // ---- boot ----
  var stack=document.getElementById("im-stack");stack.appendChild(avatar("claude"));stack.appendChild(avatar("codex"));
  var qIn=document.getElementById("im-q");
  qIn.addEventListener("input",function(){query=qIn.value;renderSide(allRows().rows);});
  document.getElementById("im-qx").addEventListener("click",function(){qIn.value="";query="";renderSide(allRows().rows);qIn.focus();});
  document.getElementById("im-back").addEventListener("click",function(){document.querySelector(".im-shell").classList.add("list");renderSide(allRows().rows);window.scrollTo(0,0);});
  (async function(){
    var c=window.claude;
    if(!c||typeof c.use!=="function"){mode="offline";render();return;}
    var got=await Promise.all([c.use("db"),c.use("user"),c.use("mcp"),c.use("sample")]);
    db=got[0];user=got[1];mcp=got[2];sample=got[3];
    note("capabilities",{db:!!db,user:!!user,mcp:!!mcp,sample:!!sample});
    if(!mcp)offlineWhy="This view has no access to local connectors. Open it in the Claude desktop app.";
    if(user){try{uid=await user.id();}catch(e){}try{canEdit=(await user.canEdit())===true;}catch(e){}}
    if(db){
      db.doc("chat/snapshot").onSnapshot(function(s){
        if(mode==="live")return;var d=s&&s.exists?s.data():null;
        if(d&&typeof d.text==="string"){chatText=d.text;if(typeof d.vaultName==="string"&&d.vaultName)VAULT_NAME=d.vaultName;if(Array.isArray(d.projects)&&d.projects.length)projects=d.projects.filter(function(x){return typeof x==="string";});if(mode==="connecting")mode="web";render();}
      },function(){});
      if(uid){try{var o=await db.doc("data/users/"+uid+"/outbox").get();var od=o&&o.exists?o.data():null;outbox=od&&Array.isArray(od.messages)?od.messages:[];}catch(e){}}
    }
    if(sample){try{var lim=await sample.limits();toolsOk=!!(lim&&lim.tools);note("sample tools",toolsOk);}catch(e){note("sample.limits failed",errInfo(e));}}
    if(mcp){
      try{var t=await findVault();if(t!=null){chatText=t;mode="live";offlineWhy="";try{projects=parseProjects(textOf(await call("read_text_file",{path:full("projects/index.md")})));}catch(e){note("projects index",errInfo(e));}saveSnapshot();setInterval(poll,20000);document.addEventListener("visibilitychange",poll);}}catch(e){note("findVault",errInfo(e));}
    }
    if(mode==="connecting")mode=db?"web":"offline";
    if(mode==="live"&&!toolsOk)offlineWhy="Claude can't use tools in this view, so replies come from the hourly sync.";
    saveDiag();render();
    if(mode==="live"&&toolsOk&&pending().some(function(m){return m.reply&&m.reply.length;}))reply(pending());
  })();
})();
</script>
